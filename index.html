<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Texas Wine Guy™</title>
<meta name="description" content="Texas Wine Guy™ — your guide to the Texas Hill Country wine trail. Launching soon.">

<!-- ============================================================= -->
<!--  TEXAS WINE GUY — coming soon                                 -->
<!--  Assets (keep alongside this file): badge.png, wordmark.svg,  -->
<!--  apple-touch-icon.png                                         -->
<!--  To change the tagline: search "TAGLINE" below.               -->
<!-- ============================================================= -->

<link rel="icon" type="image/png" href="./apple-touch-icon.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">

<!-- social share -->
<meta property="og:title" content="Texas Wine Guy™">
<meta property="og:description" content="Your guide to the Texas Hill Country wine trail. Launching soon.">
<meta property="og:image" content="./badge.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">

<style>
  :root{
    --wine-red:#7A0000;     /* brand red — TEXAS / GUY */
    --gold:#CCA300;         /* brand gold — WINE */
    --gold-deep:#A9820A;    /* gold that reads on cream */
    --wine:#3B1320;         /* deep wine, darkest ink */
    --espresso:#4A2A22;     /* warm brown body ink */
    --amber:#E0A85A;        /* golden-hour light */
    --cream:#F8F1E4;        /* limestone — top of page */
    --cream-warm:#F1E2C6;   /* warmer light — golden hour, bottom */
    --sage:#97A07B;
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  html{color-scheme:light;}

  body{
    font-family:"Jost",system-ui,-apple-system,sans-serif;
    color:var(--espresso);
    background:var(--cream);
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    position:relative;
    overflow-x:hidden;
    padding:3rem 1.5rem 2rem;
    -webkit-font-smoothing:antialiased;
  }

  /* golden-hour wash — warm light rising from below */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    background:
      radial-gradient(140% 95% at 50% 120%, rgba(224,168,90,.55) 0%, rgba(224,168,90,.16) 38%, rgba(224,168,90,0) 64%),
      linear-gradient(180deg, var(--cream) 0%, #F6ECD9 52%, var(--cream-warm) 100%);
  }

  /* soft rolling ridgelines at the very bottom — Hill Country, kept light */
  .hills{
    position:fixed;
    left:0;right:0;bottom:0;
    width:100%;
    z-index:1;
    pointer-events:none;
    line-height:0;
  }
  .hills svg{width:100%;height:auto;display:block;}

  main{
    position:relative;
    z-index:2;
    max-width:600px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:1.6rem;
  }

  /* ---- badge hero ---- */
  .hero{
    position:relative;
    width:clamp(230px, 58vw, 400px);
    aspect-ratio:1/1;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .hero::before{  /* amber halo behind the badge */
    content:"";
    position:absolute;
    inset:-8%;
    border-radius:50%;
    background:radial-gradient(circle, rgba(224,168,90,.5) 0%, rgba(224,168,90,.14) 46%, rgba(224,168,90,0) 70%);
    z-index:0;
  }
  .hero img{
    position:relative;
    z-index:1;
    width:100%;
    height:auto;
    filter:drop-shadow(0 16px 34px rgba(59,19,32,.26));
  }

  .eyebrow{
    font-size:.72rem;
    letter-spacing:.44em;
    text-transform:uppercase;
    font-weight:500;
    color:var(--wine-red);
    padding-left:.44em;
  }

  .tagline{
    font-size:clamp(1.04rem,2.5vw,1.3rem);
    line-height:1.6;
    color:var(--espresso);
    max-width:33ch;
    font-weight:400;
  }

  .rule{
    width:48px;height:2px;border-radius:2px;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);
    opacity:.85;
  }

  .status{
    font-style:italic;
    font-weight:400;
    font-size:clamp(1rem,2.3vw,1.16rem);
    color:var(--wine);
    max-width:30ch;
  }

  /* ---- footer sign-off ---- */
  footer{
    position:relative;
    z-index:2;
    margin-top:1.4rem;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:.7rem;
  }
  footer img{
    width:clamp(150px, 34vw, 210px);
    height:auto;
    opacity:.92;
  }
  footer .loc{
    font-size:.64rem;
    letter-spacing:.34em;
    text-transform:uppercase;
    color:var(--gold-deep);
    font-weight:500;
  }

  /* entrance */
  @media (prefers-reduced-motion:no-preference){
    main > *, footer{opacity:0;transform:translateY(16px);animation:rise .95s cubic-bezier(.2,.7,.2,1) forwards;}
    .hero{animation-delay:.05s;}
    main > .eyebrow{animation-delay:.22s;}
    main > .tagline{animation-delay:.34s;}
    main > .rule{animation-delay:.44s;}
    main > .status{animation-delay:.52s;}
    footer{animation-delay:.66s;}
    @keyframes rise{to{opacity:1;transform:none;}}
  }
</style>
</head>
<body>

  <main>
    <div class="hero">
      <img src="./badge.png" alt="Texas Wine Guy™ — illustrated badge logo" width="900" height="900">
    </div>

    <p class="eyebrow">Texas Hill Country</p>

    <!-- TAGLINE -->
    <p class="tagline">Your guide to the Hill Country wine trail — the pours worth stopping for, the folks behind the bar, and how to plan the perfect day out.</p>

    <div class="rule"></div>

    <p class="status">Something good is aging in the barrel. Launching soon.</p>
  </main>

  <footer>
    <img src="./wordmark.svg" alt="Texas Wine Guy™">
    <span class="loc">★ Est. 2026 ★</span>
  </footer>

  <div class="hills" aria-hidden="true">
    <svg viewBox="0 0 1440 220" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <path fill="#C9A66B" fill-opacity="0.30" d="M0,150 C200,110 360,168 560,146 C800,120 960,92 1200,132 C1320,152 1400,160 1440,156 L1440,220 L0,220 Z"/>
      <path fill="#97A07B" fill-opacity="0.34" d="M0,180 C220,156 380,200 600,182 C840,162 1000,150 1220,182 C1330,198 1400,202 1440,200 L1440,220 L0,220 Z"/>
    </svg>
  </div>

</body>
</html>
